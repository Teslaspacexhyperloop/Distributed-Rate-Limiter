# Phase 4: NGINX load balancer across two stateless gateway instances.
# Round-robin distributes traffic; passive health checks remove a failed
# instance after 3 consecutive errors for 30 seconds.
#
# Admin API is intentionally not exposed here — access it directly on each
# instance's host port (8091 for gateway1, 8092 for gateway2). This prevents
# external clients from triggering cache flushes or overrides.

events {
    worker_connections 1024;
}

http {
    upstream gateways {
        server gateway1:8080 max_fails=3 fail_timeout=30s;
        server gateway2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 80;

        location /admin/ {
            return 403 '{"error":"admin API not available via load balancer"}';
            add_header Content-Type application/json always;
        }

        location / {
            proxy_pass http://gateways;

            # Forward the real client IP so the gateway's IP-based rate
            # limiting and whitelist/blacklist checks see the original address.
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;
            proxy_send_timeout    30s;
        }
    }
}
