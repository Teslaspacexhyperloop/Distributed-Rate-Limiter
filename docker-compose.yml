services:
  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    ports:
      # Host 8080 is already in use on this machine.
      - "8090:8080"
    environment:
      GATEWAY_PORT: "8080"
      USER_SERVICE_URL: "http://user-service:8081"
      PRODUCT_SERVICE_URL: "http://product-service:8082"
      ORDER_SERVICE_URL: "http://order-service:8083"
      REDIS_ADDR: "redis:6379"
      # open = allow all requests when Redis is down (availability over safety)
      # closed = deny all requests when Redis is down (safety over availability)
      RATE_LIMIT_FAILURE_MODE: "open"
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    environment:
      PORT: "8081"

  product-service:
    build:
      context: .
      args:
        SERVICE: product-service
    environment:
      PORT: "8082"

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      PORT: "8083"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
