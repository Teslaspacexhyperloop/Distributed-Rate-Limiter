services:
  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    ports:
      # Host 8080 is already in use by another project on this machine.
      - "8090:8080"
    environment:
      GATEWAY_PORT: "8080"
      USER_SERVICE_URL: "http://user-service:8081"
      PRODUCT_SERVICE_URL: "http://product-service:8082"
      ORDER_SERVICE_URL: "http://order-service:8083"
    depends_on:
      - user-service
      - product-service
      - order-service

  user-service:
    build:
      context: .
      args:
        SERVICE: user-service
    environment:
      PORT: "8081"

  product-service:
    build:
      context: .
      args:
        SERVICE: product-service
    environment:
      PORT: "8082"

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      PORT: "8083"
